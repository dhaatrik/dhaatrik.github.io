name: Link Health & Integrity Audit

on:
    schedule:
        # Run every Sunday at 00:00 UTC
        - cron: '0 0 * * 0'
    workflow_dispatch:

permissions:
    contents: read
    issues: write

concurrency:
    group: link-check-${{ github.ref }}
    cancel-in-progress: true

jobs:
    link-checker:
        name: Scan Markdown & Content Links
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build static site
              run: npm run build

            - name: Restore lychee cache
              uses: actions/cache@v4
              with:
                  path: .lycheecache
                  key: lychee-cache-${{ github.sha }}
                  restore-keys: |
                      lychee-cache-

            - name: Run Lychee Link Checker
              id: lychee
              uses: lycheeverse/lychee-action@v2
              with:
                  args: >-
                      --cache
                      --max-cache-age 1d
                      --timeout 15
                      --max-concurrency 8
                      --accept 200,204,429
                      --exclude 'https?://(www\.)?(x\.com|twitter\.com|linkedin\.com|medium\.com).*'
                      --exclude 'https?://localhost.*'
                      --exclude 'https?://127\.0\.0\.1.*'
                      --exclude 'file:///.*'
                      --exclude 'https?://dhaatrik\.github\.io/404/?'
                      --root-dir "${{ github.workspace }}/dist"
                      README.md AGENTS.md public/llms.txt public/llms-full.txt 'src/content/**/*.md' 'dist/**/*.html'
                  output: ./lychee-out.md

            - name: Create or Update Issue on Broken Links
              if: steps.lychee.outputs.exit_code != 0
              uses: peter-evans/create-issue-from-file@v5
              with:
                  title: '⚠️ Broken Link Detected in Repository Content'
                  content-filepath: ./lychee-out.md
                  labels: |
                      triage
                      automated-audit
