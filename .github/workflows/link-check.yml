name: Link Health & Integrity Audit

on:
    schedule:
        # Run every Sunday at 00:00 UTC
        - cron: '0 0 * * 0'
    workflow_dispatch:

permissions:
    contents: read
    issues: write

concurrency:
    group: link-check-${{ github.ref }}
    cancel-in-progress: true

jobs:
    link-checker:
        name: Scan Markdown & Content Links
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build static site
              run: npm run build

            - name: Restore lychee cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .lycheecache
                  key: lychee-cache-v2-${{ github.sha }}
                  restore-keys: |
                      lychee-cache-v2-

            - name: Run Lychee Link Checker
              id: lychee
              uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
              with:
                  args: >-
                      --cache
                      --max-cache-age 1d
                      --cache-exclude-status '500..=599'
                      --max-retries 3
                      --retry-wait-time 3
                      --timeout 15
                      --max-concurrency 8
                      --accept 200,204,429
                      --exclude 'https?://(www\.)?(x\.com|twitter\.com|linkedin\.com|medium\.com).*'
                      --exclude 'https?://(www\.)?amazon\.(in|com|co\.uk).*'
                      --exclude 'https?://localhost.*'
                      --exclude 'https?://127\.0\.0\.1.*'
                      --exclude 'file:///.*'
                      --exclude 'https?://dhaatrik\.github\.io/404/?'
                      --root-dir "${{ github.workspace }}/dist"
                      README.md AGENTS.md public/llms.txt public/llms-full.txt 'src/content/**/*.md' 'dist/**/*.html'
                  output: ./lychee-out.md

            - name: Create or Update Issue on Broken Links
              if: steps.lychee.outputs.exit_code != 0
              uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5
              with:
                  title: '⚠️ Broken Link Detected in Repository Content'
                  content-filepath: ./lychee-out.md
                  labels: |
                      triage
                      automated-audit
