name: CI/CD Pipeline

on:
    # Trigger tests on push to main AND any pull request targeting main
    push:
        branches: [main]
    pull_request:
        branches: [main]
    # Allows manual runs from the Actions tab
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    verify:
        name: Code Quality & Engineering Verification
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Verify code formatting (Prettier)
              run: npx prettier --check .

            - name: Run Astro TypeScript typecheck
              run: npx astro check

            - name: Run unit & content validation tests
              run: npm test

            - name: Cache Playwright browser binaries
              uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

            - name: Install Playwright Chromium
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium

            - name: Run E2E verification
              run: npm run test:e2e

            - name: Upload Playwright report on failure
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 14

    build:
        name: Build Static Artifacts
        needs: verify
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Compile and upload production build
              uses: withastro/action@v3
              with:
                  node-version: 22
                  package-manager: npm
              env:
                  PUBLIC_GIT_SHA: ${{ github.sha }}

    deploy:
        name: Launch to Production
        needs: build
        # Strict assurance that deployment only occurs from main
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        permissions:
            pages: write
            id-token: write
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
