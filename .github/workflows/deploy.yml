name: CI/CD Pipeline

on:
    # Trigger tests on push to main AND any pull request targeting main
    push:
        branches: [main]
    pull_request:
        branches: [main]
    # Allows manual runs from the Actions tab
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    verify:
        name: Code Quality & Engineering Verification
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Verify code formatting (Prettier)
              run: npx prettier --check .

            - name: Run Astro TypeScript typecheck
              run: npx astro check

            - name: Run unit & content validation tests
              run: npm test

            - name: Cache Playwright browser binaries
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

            - name: Install Playwright Chromium
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium

            - name: Install Playwright Chromium OS dependencies
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps chromium

            - name: Run E2E verification
              run: npm run test:e2e

            - name: Upload Playwright report on failure
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              if: failure()
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 14

    build:
        name: Build Static Artifacts
        needs: verify
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Compile and upload production build
              uses: withastro/action@56781b97402ce0487b7e61ce2cb960c0e2cc5289 # v3
              with:
                  node-version: 22
                  package-manager: npm
              env:
                  PUBLIC_GIT_SHA: ${{ github.sha }}

    deploy:
        name: Launch to Production
        needs: build
        # Strict assurance that deployment only occurs from main
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        permissions:
            pages: write
            id-token: write
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

    release:
        name: Manage Versioning & Changelog
        needs: [verify, build, deploy]
        # Strict assurance that versioning/release only runs after successful deployment on main
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Run Google Release Please
              id: release
              uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
