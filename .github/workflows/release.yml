name: Release Please

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        name: Manage Versioning & Changelog
        runs-on: ubuntu-latest
        steps:
            - name: Run Google Release Please
              id: release
              uses: googleapis/release-please-action@v4
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
