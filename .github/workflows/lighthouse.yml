name: Lighthouse Audit & Web Vitals

on:
    schedule:
        # Run every Sunday at 02:00 UTC
        - cron: '0 2 * * 0'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: lighthouse-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lighthouse:
        name: Audit Core Web Vitals & Accessibility
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup Node.js 22
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build static production site
              run: npm run build

            - name: Run Lighthouse CI Audit
              uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
              with:
                  configPath: './.lighthouserc.json'
                  uploadArtifacts: true
                  temporaryPublicStorage: true
