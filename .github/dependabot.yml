version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '04:00'
          timezone: 'UTC'
      open-pull-requests-limit: 3
      groups:
          actions:
              patterns:
                  - '*'
      labels:
          - 'dependencies'
          - 'ci'

    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '04:00'
          timezone: 'UTC'
      open-pull-requests-limit: 3
      groups:
          dependencies:
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'
      ignore:
          - dependency-name: 'js-yaml'
            update-types: ['version-update:semver-major']
          - dependency-name: 'tailwindcss'
            update-types: ['version-update:semver-major']
          - dependency-name: '@tailwindcss/*'
            update-types: ['version-update:semver-major']
      labels:
          - 'dependencies'
